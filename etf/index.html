<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETF份额追踪</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>📊</text></svg>">
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;background:#0f172a;color:#e2e8f0}
.container{text-align:center;max-width:400px;padding:20px}
.spinner{border:3px solid #334155;border-top:3px solid #8b5cf6;border-radius:50%;width:40px;height:40px;animation:spin 1s linear infinite;margin:0 auto 20px}
@keyframes spin{to{transform:rotate(360deg)}}
h1{font-size:1.3rem;color:#f8fafc;margin:0}
p{font-size:.85rem;color:#94a3b8;margin:6px 0 0}
</style>
<script>
(function(){
var done=false;
function go(u){if(done||!u)return;done=true;location.replace(u);}

var ETF_JID = '019fc2ef-a27b-7021-9165-ea048b068b2b';

// 跳转 URL 获取：jsonblob 主源（实时）+ config.json 并行兜底，谁先返回有效 URL 用谁
// 修复：jsonblob 慢（实测 1-4s+）不应拖死跳转；config.json 立即并行发起，不再等 6s
function fetchUrl(jid){
  return new Promise(function(resolve){
    var got = false;
    function done(u){ if(got) return; got = true; resolve(u); }
    // jsonblob 主源（实时无缓存），8s 超时（比原 6s 放宽，给慢网络余地）
    var ctrl = new AbortController();
    setTimeout(function(){ ctrl.abort(); }, 8000);
    fetch('https://jsonblob.com/api/jsonBlob/'+jid, {signal:ctrl.signal, cache:'no-store'})
      .then(function(r){ return r.json(); })
      .then(function(d){ if(d && d.url) done(d.url); })
      .catch(function(){});
    // config.json 并行兜底：立即发起（不再等 jsonblob 超时），
    // 虽可能被 CDN 缓存旧 URL，但至少能跳转，404 刷新即可
    fetch('config.json', {cache:'no-store'})
      .then(function(r){ return r.json(); })
      .then(function(d){ if(d && d.url) done(d.url); })
      .catch(function(){});
    setTimeout(function(){ done(null); }, 8500); // 总防呆兜底
  });
}

fetchUrl(ETF_JID).then(function(u){
  if(u){ go(u); return; }
  document.querySelector('.container').innerHTML='<h1>ETF 份额追踪</h1><p>服务暂不可用</p>';
});
})();
</script>
</head>
<body>
<div class="container"><div class="spinner"></div><h1>ETF 份额追踪</h1><p>加载中...</p></div>
</body>
</html>
