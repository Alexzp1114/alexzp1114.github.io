<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alex 的工具箱</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>🔧</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  display:flex;justify-content:center;align-items:flex-start;
  min-height:100vh;padding-top:12vh;cursor:default;
  background:linear-gradient(180deg,#0f172a 0%,#1e293b 100%);
  color:#e2e8f0
}

.card{
  background:#1e293b;
  border:1px solid #334155;
  border-radius:16px;
  padding:36px 32px 28px;
  text-align:center;
  max-width:380px;width:90vw;
  box-shadow:0 8px 32px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.03);
}

.title-row{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:6px}
.title-row .icon{font-size:1.5rem}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.subtitle{font-size:.78rem;color:#64748b;margin-bottom:26px;letter-spacing:.3px}

.btn{
  display:flex;align-items:center;gap:10px;
  padding:16px 20px;margin:10px 0;border-radius:10px;
  text-decoration:none;font-size:.95rem;font-weight:600;
  transition:transform .15s,box-shadow .15s,filter .15s
}
.btn:hover{transform:translateY(-2px);filter:brightness(1.1)}
.btn .btn-emoji{font-size:1.2rem;flex-shrink:0}
.btn .btn-text{flex:1;text-align:left}
.btn .btn-arrow{opacity:.5;font-size:.85rem;transition:opacity .15s,transform .15s}
.btn:hover .btn-arrow{opacity:1;transform:translateX(2px)}

.canslim{
  background:#dc2626 !important;color:#fff !important;
  box-shadow:0 4px 16px rgba(220,38,38,.35)
}
.etf{
  background:linear-gradient(135deg,#7c3aed,#6d28d9);
  color:#fff;box-shadow:0 4px 16px rgba(124,58,237,.25)
}

.status-bar{
  margin-top:24px;padding-top:18px;
  border-top:1px solid #334155;text-align:left
}
.status-section-hdr{
  font-size:.6rem;font-weight:600;color:#475569;
  text-transform:uppercase;letter-spacing:1.2px;
  margin:8px 0 6px 0
}
.status-row{
  display:flex;align-items:center;gap:8px;
  margin:6px 0;font-size:.75rem;color:#94a3b8;
  white-space:nowrap;padding:4px 8px;
  border-radius:6px;transition:background .2s
}
.status-row:hover{background:rgba(255,255,255,.03)}
.status-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.dot-online{background:#22c55e;box-shadow:0 0 8px rgba(34,197,94,.5)}
.dot-offline{background:#ef4444;box-shadow:0 0 8px rgba(239,68,68,.4)}
.dot-checking{background:#f59e0b;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.status-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status-label a{display:inline;color:#38bdf8;text-decoration:none;font-size:inherit}
.status-label a:hover{text-decoration:underline}
.name-tag{display:inline-block;min-width:64px}

/* 隧道更换按钮 */
.rotate-btn{
  flex-shrink:0;
  background:rgba(56,189,248,.12);
  border:1px solid rgba(56,189,248,.35);
  color:#7dd3fc;
  font-size:.65rem;line-height:1;
  padding:4px 8px;border-radius:5px;
  cursor:pointer;
  transition:background .15s,transform .15s,opacity .15s;
  opacity:.85;user-select:none
}
.rotate-btn:hover{background:rgba(56,189,248,.25);transform:translateY(-1px);opacity:1}
.rotate-btn:active{transform:translateY(0)}
.rotate-btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.rotate-btn.sending{background:rgba(245,158,11,.15);border-color:rgba(245,158,11,.4);color:#fbbf24}

.footer{
  text-align:center;font-size:.65rem;color:#475569;
  margin-top:8px;padding-top:8px
}
</style>
</head>
<body>
<div class="card">
  <h1>Alex 的工具箱</h1>

  <a class="btn cansim" href="/canslim/" style="background:#ef4444;color:#fff">
    <span class="btn-emoji">📈</span>
    <span class="btn-text">CANSLIM 选股分析</span>
    <span class="btn-arrow">→</span>
  </a>
  <a class="btn etf" href="/etf/">
    <span class="btn-emoji">📊</span>
    <span class="btn-text">宽基ETF份额追踪</span>
    <span class="btn-arrow">→</span>
  </a>

  <div class="status-bar" id="status-section" style="display:none">
    <div class="status-section-hdr">隧道在线</div>
    <div class="status-row">
      <div class="status-dot dot-checking" id="canslim-dot"></div>
      <span class="status-label" id="canslim-label">检测中...</span>
      <button class="rotate-btn" id="canslim-rotate" title="隧道太慢时手动更换">更换</button>
    </div>
    <div class="status-row">
      <div class="status-dot dot-checking" id="etf-dot"></div>
      <span class="status-label" id="etf-label">检测中...</span>
      <button class="rotate-btn" id="etf-rotate" title="隧道太慢时手动更换">更换</button>
    </div>
    <div class="status-section-hdr">守护者</div>
    <div class="status-row">
      <div class="status-dot dot-checking" id="canslim-super-dot"></div>
      <span class="status-label" id="canslim-super-label">CANSLIM</span>
    </div>
    <div class="status-row">
      <div class="status-dot dot-checking" id="etf-super-dot"></div>
      <span class="status-label" id="etf-super-label">宽基ETF</span>
    </div>
  </div>
</div>
<script>
(function(){
// ===== 配置 =====
var CANSLIM_JID = '019fbf57-7448-721b-8f42-972d8958e3ba'; // 当前活跃 blob
var ETF_JID = '019fc2ef-a27b-7021-9165-ea048b068b2b';
// 手动换隧道指令通道（固定 ID jsonblob）：前端 PUT 指令 → 守护者轮询执行 → 清空
var CANSLIM_CMD_JID = '019fc0ad-2e06-7720-91d0-0439a9e5db3e';
var ETF_CMD_JID = '019fc0ad-3661-7941-bfe7-3b134a0ccc3e';
var FETCH_TIMEOUT = 3000;   // blob/config 3s 超时
var PROBE_TIMEOUT = 8000;   // 隧道探测 8s 超时（与守护者健康检查对齐，减少 r10/r8/r17 慢节点误报）
var HEARTBEAT_TOLERANCE = 180; // 守护者在线判定阈值：ts 超过 180s 才算离线（心跳 120s+15s 抖动 + 重试余量）
var POLL_MS = 30000;        // 30s 轮询
var FAIL_THRESHOLD = 2;     // 防抖：连续失败 N 次才报"离线/检测中"，避免单次网络波动误报
// 防抖计数器（按应用名）：心跳读取失败 / 隧道探测失败各计各的，成功即清零
var hbFail = {};
var tuFail = {};

function el(id){return document.getElementById(id)}

function setDot(id, cls){
  var d = el(id); if(!d) return;
  d.className = 'status-dot ' + cls;
}

function shortHost(url){
  var h = url.replace('https://','').replace('http://','').split('.')[0];
  return h.length > 10 ? h.slice(0,10)+'...' : h;
}

// 带超时的 fetch
// cache:'no-store' 关键：GitHub Pages CDN 对 config.json 有 max-age=600 缓存，
// 不加 no-store 会命中 10 分钟旧心跳 → 守护者误判离线
function fetchTimeout(url, ms){
  var ctrl = new AbortController();
  var t = setTimeout(function(){ ctrl.abort() }, ms);
  return fetch(url, {signal: ctrl.signal, cache: 'no-store'}).then(function(r){
    clearTimeout(t);
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.json();
  }, function(e){ clearTimeout(t); throw e; });
}

// localStorage 缓存（秒出用；超过 10 分钟视为过期，避免旧状态闪烁）
var CACHE_TTL = 10*60*1000;
function saveState(name, d){
  try{ localStorage.setItem('toolbox_'+name, JSON.stringify({url:d.url, ts:d.ts||0, src:d.src||'', at:Date.now()})); }catch(e){}
}
function loadState(name){
  try{
    var c = JSON.parse(localStorage.getItem('toolbox_'+name));
    if(c && (Date.now() - (c.at||0)) < CACHE_TTL) return c;
    return null;
  }catch(e){ return null; }
}

// 心跳与隧道解耦设计：
// - 心跳（守护者在线与否）只认 jsonblob —— 它实时（no-cache + ETag 验证），是权威源
// - 隧道状态独立判断 —— 拿 jsonblob 里的 url 直接探测可达性
// - 不再读 config.json：GitHub Pages CDN 对它 max-age=600 缓存，ts/url 都不可信，兜底价值低
var JSONBLOB_TIMEOUT = 6000; // jsonblob 国外服务，给足 6s
function fetchAppState(jid, cfgPath){
  return new Promise(function(resolve){
    var got = false;
    function done(d){ if(got) return; got = true; resolve(d); }
    // 唯一数据源：jsonblob（实时心跳 + 隧道 url）
    fetchTimeout('https://jsonblob.com/api/jsonBlob/'+jid, JSONBLOB_TIMEOUT)
      .then(function(d){ if(d && d.url) done({url:d.url, ts:d.ts||0, src:'jsonblob'}); })
      .catch(function(){});
    setTimeout(function(){ done(null); }, JSONBLOB_TIMEOUT + 500); // 防呆兜底
  });
}

function ageText(ts){
  if(!ts) return '';
  var sec = Math.floor(Date.now()/1000 - ts);
  return sec+'s前';
}

// 渲染单个应用的状态（隧道 + 守护者），心跳与隧道解耦：
// - 心跳：只认 jsonblob 的 ts（src==='jsonblob' 才判在线/离线）
// - 隧道：拿 url 直接探测可达性（独立于心跳）
function renderApp(name, d, ids, isPreview){
  var tunnelDot = ids[0], tunnelLabel = ids[1], superDot = ids[2], superLabel = ids[3];
  var key = name;
  var now = Date.now()/1000;
  var isHeartbeat = d && d.src === 'jsonblob' && d.ts;   // 只有 jsonblob 的 ts 可信
  var alive = isHeartbeat && ((now - d.ts) < HEARTBEAT_TOLERANCE); // 守护者在线只看 jsonblob ts 新鲜度

  // ===== 心跳防抖 =====
  // jsonblob 读取失败或 ts 过期 → 失败计数 +1；只有连续 FAIL_THRESHOLD 次失败才报"检测中/离线"
  // 任意一次成功（读到新鲜心跳）→ 清零
  // isPreview（秒出缓存渲染）不参与计数，避免"缓存渲染+立即refresh"同秒计两次
  var hbOk = isHeartbeat && alive;
  if(!isPreview){
    if(hbOk){
      hbFail[key] = 0;
    } else {
      hbFail[key] = (hbFail[key]||0) + 1;
    }
  }
  var hbStable = hbFail[key] >= FAIL_THRESHOLD; // 连续失败足够次，判定为稳定离线

  var ts = isHeartbeat ? d.ts : 0;
  var tsStr = ts ? new Date(ts*1000).toTimeString().slice(0,5) : '';
  var age = alive ? ageText(ts) : '';

  // 守护者行：有新鲜 jsonblob 心跳 → 在线；连续 FAIL_THRESHOLD 次失败 → 离线；其余 → 检测中
  if(hbOk){
    setDot(superDot, 'dot-online');
    el(superLabel).innerHTML = '<span class="name-tag" style="display:inline-block;min-width:64px">' + name + '</span><span style="font-size:0.7rem;color:#64748b">' + tsStr + ' · ' + age + '</span>';
  } else if(hbStable){
    setDot(superDot, 'dot-offline');
    el(superLabel).innerHTML = '<span class="name-tag" style="display:inline-block;min-width:64px">' + name + '</span><span style="font-size:0.7rem;color:#ef4444">离线</span>';
  } else {
    // 首次失败（或缓存兜底无新鲜心跳）：检测中，等下一次轮询确认
    setDot(superDot, 'dot-checking');
    el(superLabel).innerHTML = '<span class="name-tag" style="display:inline-block;min-width:64px">' + name + '</span><span style="font-size:0.7rem;color:#f59e0b">检测中</span>';
  }

  // 隧道行（独立探测，与心跳无关）
  if(d && d.url){
    setDot(tunnelDot, 'dot-checking');
    el(tunnelLabel).textContent = shortHost(d.url);
    if(isPreview){
      // 秒出：不探测不计数，显示检测中占位，等 refresh 结果接管
      return;
    }
    var ctrl = new AbortController();
    setTimeout(function(){ ctrl.abort() }, PROBE_TIMEOUT);
    fetch(d.url, {mode:'no-cors', signal:ctrl.signal})
      .then(function(){
        tuFail[key] = 0;   // 探测成功 → 清零防抖计数
        setDot(tunnelDot, 'dot-online');
        el(tunnelLabel).innerHTML = '<span class="name-tag">'+name+'</span> <a href="'+d.url+'" target="_blank">'+shortHost(d.url)+'</a>';
      })
      .catch(function(){
        tuFail[key] = (tuFail[key]||0) + 1;   // 探测失败 → 计数
        if(tuFail[key] >= FAIL_THRESHOLD){    // 连续失败足够次才报离线
          setDot(tunnelDot, 'dot-offline');
          el(tunnelLabel).textContent = name+' 离线';
        } else {
          setDot(tunnelDot, 'dot-checking');  // 首次失败不报，保持检测中等待下轮
          el(tunnelLabel).textContent = shortHost(d.url);
        }
      });
  } else if(isPreview){
    // 秒出且无缓存 url：显示检测中占位，不报离线
    setDot(tunnelDot, 'dot-checking');
    el(tunnelLabel).textContent = name+' 检测中';
  } else {
    setDot(tunnelDot, 'dot-offline');
    el(tunnelLabel).textContent = name+' 离线';
  }
}

function refresh(name, jid, cfgPath, ids){
  fetchAppState(jid, cfgPath).then(function(d){
    if(d) saveState(name.toLowerCase(), d);
    renderApp(name, d || loadState(name.toLowerCase()), ids);
  });
}

// ===== 手动更换隧道 =====
// 前端无法直接命令守护进程（静态页），通过"指令 jsonblob"中间信箱：
// PUT {"cmd":"rotate"} → 守护者每 30s 轮询指令 → 执行隧道轮换 → 清空指令
function sendRotateCmd(name, cmdJid, btnId){
  var btn = el(btnId);
  if(!btn || btn.disabled) return;
  if(!confirm('确定更换「' + name + '」的隧道？\n\n将重启隧道服务（约 10-30 秒），期间应用可能短暂无法访问。')){
    return;
  }
  btn.disabled = true;
  btn.classList.add('sending');
  btn.textContent = '发送中...';
  var ctrl = new AbortController();
  setTimeout(function(){ ctrl.abort(); }, 8000);
  fetch('https://jsonblob.com/api/jsonBlob/' + cmdJid, {
    method: 'PUT',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({cmd:'rotate', ts: Math.floor(Date.now()/1000)}),
    signal: ctrl.signal
  }).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    btn.classList.remove('sending');
    btn.textContent = '已发送 ✓';
    setTimeout(function(){
      if(!btn.dataset.disabled){
        btn.disabled = false;
        btn.textContent = '更换';
      }
    }, 5000);
  }).catch(function(){
    btn.classList.remove('sending');
    btn.textContent = '发送失败';
    setTimeout(function(){
      if(!btn.dataset.disabled){
        btn.disabled = false;
        btn.textContent = '更换';
      }
    }, 3000);
  });
}

el('status-section').style.display = 'block';

// ===== 秒出：先渲染上次缓存（isPreview=true：不探测不计数，等 refresh 接管）=====
renderApp('CANSLIM', loadState('canslim'), ['canslim-dot','canslim-label','canslim-super-dot','canslim-super-label'], true);
renderApp('宽基ETF', loadState('etf'), ['etf-dot','etf-label','etf-super-dot','etf-super-label'], true);

// ===== 手动更换隧道按钮 =====
el('canslim-rotate').addEventListener('click', function(){
  sendRotateCmd('CANSLIM', CANSLIM_CMD_JID, 'canslim-rotate');
});
el('etf-rotate').addEventListener('click', function(){
  sendRotateCmd('宽基ETF', ETF_CMD_JID, 'etf-rotate');
});

// ===== 立即检测 + 30s 轮询 =====
refresh('CANSLIM', CANSLIM_JID, 'canslim/config.json', ['canslim-dot','canslim-label','canslim-super-dot','canslim-super-label']);
refresh('宽基ETF', ETF_JID, 'etf/config.json', ['etf-dot','etf-label','etf-super-dot','etf-super-label']);
setInterval(function(){
  refresh('CANSLIM', CANSLIM_JID, 'canslim/config.json', ['canslim-dot','canslim-label','canslim-super-dot','canslim-super-label']);
  refresh('宽基ETF', ETF_JID, 'etf/config.json', ['etf-dot','etf-label','etf-super-dot','etf-super-label']);
}, POLL_MS);
})();
</script>
</body>
</html>
