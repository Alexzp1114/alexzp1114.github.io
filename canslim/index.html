<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CANSLIM</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>📈</text></svg>">
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;background:#0f172a;color:#e2e8f0}
.container{text-align:center;max-width:400px;padding:20px}
.spinner{border:3px solid #334155;border-top:3px solid #ef4444;border-radius:50%;width:40px;height:40px;animation:spin 1s linear infinite;margin:0 auto 20px}
@keyframes spin{to{transform:rotate(360deg)}}
h1{font-size:1.3rem;color:#f8fafc;margin:0}
p{font-size:.85rem;color:#94a3b8;margin:6px 0 0}
</style>
<script>
(function(){
var done=false;
function go(u){if(done||!u)return;done=true;location.replace(u);}

// jsonblob 动态读取隧道 URL
fetch('https://jsonblob.com/api/jsonBlob/019fa887-89f3-7d57-8ff0-5fbd872a7a2e')
.then(function(r){return r.json()}).then(function(d){go(d.url)}).catch(function(){});
// 2 秒兜底 → config.json
setTimeout(function(){
fetch('config.json').then(function(r){return r.json()}).then(function(d){go(d.url)})
.catch(function(){
document.querySelector('.container').innerHTML='<h1>CANSLIM</h1><p>服务暂不可用</p>';
});
},2000);
})();
</script>
</head>
<body>
<div class="container"><div class="spinner"></div><h1>CANSLIM</h1><p>加载中...</p></div>
</body>
</html>
